
name: Build Masters Show APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q MastersShowAndroidBuild.zip -d unpacked
          cp -R unpacked/MastersShowAndroid/app .
          cp unpacked/MastersShowAndroid/build.gradle .
          cp unpacked/MastersShowAndroid/settings.gradle .
          cp unpacked/MastersShowAndroid/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Masters-Show-APK
          path: app/build/outputs/apk/debug/app-debug.apk
